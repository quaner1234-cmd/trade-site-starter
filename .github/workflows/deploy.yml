# Continuous deployment → Cloudflare Workers (static assets, free tier)
#
# ISOLATION: production and previews are SEPARATE WORKERS.
#   default branch → Worker  $WORKER_NAME          (serves the custom domain)
#   other refs     → Worker  $WORKER_NAME-preview  (preview host only)
#
# Two Workers, not one Worker with two branches. A Worker has a single live
# version, so deploying a preview branch into the production Worker would
# replace the live site; keeping them apart makes that impossible. The preview
# Worker builds with the production canonical URL so previews are never indexed
# as duplicates.
#
# `npm run verify` gates this pipeline: a commit that breaks a link, a canonical,
# the sitemap, an image alt, or that leaves no working inquiry path fails here
# and never reaches production.
name: Deploy

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  # Serialise per ref so a preview run cannot race another deploy.
  group: workers-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Production Worker name. Keep in sync with wrangler.jsonc.
  WORKER_NAME: trade-site-starter

jobs:
  deploy:
    # Never run secrets against a fork's code.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Resolve deploy target
        id: target
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ] \
             && [ "${{ github.ref }}" = "refs/heads/${{ github.event.repository.default_branch }}" ]; then
            echo "worker=${WORKER_NAME}" >> "$GITHUB_OUTPUT"
            echo "environment=production" >> "$GITHUB_OUTPUT"
          else
            echo "worker=${WORKER_NAME}-preview" >> "$GITHUB_OUTPUT"
            echo "environment=preview" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        env:
          # Previews keep the PRODUCTION canonical so they are never indexed
          # as duplicates of the live site.
          PUBLIC_SITE_URL: ${{ vars.PUBLIC_SITE_URL }}
        run: npm run build

      - name: Verify build output
        env:
          PUBLIC_SITE_URL: ${{ vars.PUBLIC_SITE_URL }}
        run: npm run verify

      - name: SEO / GEO rule check
        env:
          PUBLIC_SITE_URL: ${{ vars.PUBLIC_SITE_URL }}
        run: npm run seo

      - name: Deploy to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --name "${{ steps.target.outputs.worker }}"

      - name: Report
        run: |
          echo "### Deploy result" >> "$GITHUB_STEP_SUMMARY"
          echo "- Environment: ${{ steps.target.outputs.environment }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Worker: ${{ steps.target.outputs.worker }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: ${{ github.sha }}" >> "$GITHUB_STEP_SUMMARY"
